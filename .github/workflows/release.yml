# The Windows release: each shipping machine's own plugin (VST3 and the standalone app), checked
# with its own tests and the instruments host's (the runner has no ROMs, so the machines are checked
# in voice mode), each zipped by tools/release/windows.ps1. The TR-909 and TR-808 are built with clang-cl: the
# 909's circuit solver runs about 15 % faster than with MSVC (windows-machine.yml's bench), and the 808's is the same solver. Runs on demand
# and for release tags; the zips are the run's artifact. Each plugin has its own version (its
# lemus_plugin() VERSION) and its own tag, <plugin>-v<version> (ro-drums-909-v0.2.1): a tag's run
# keeps only that plugin's zip, and fails if the plugin isn't at the tag's version. The macOS release
# is built locally (tools/release/mac.sh), where the signing keys are.
#
# Where the SignPath secrets are set (the public repo, github.com/lemus-dev/lemus), the zips are
# signed by SignPath Foundation: the exe and the VST3 in each (tools/release/signpath.xml), once a
# person approves the request on signpath.io. Without them the zips stay unsigned.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['*-v[0-9]*']

jobs:
  windows:
    runs-on: windows-2022
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: |
          cmake -S . -B build/release-win -G "Visual Studio 17 2022" -A x64 -DLEMUS_MACHINES=tb303 -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-tr909 -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLEMUS_MACHINES=tr909 -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-tr808 -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLEMUS_MACHINES=tr808 -DLEMUS_COPY_PLUGINS=OFF
      - name: Build
        run: |
          cmake --build build/release-win --config Release --parallel --target plugin_tb303_VST3 plugin_tb303_Standalone lemustest_tb303 lemustest_instrument
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-tr909 --config Release --parallel --target plugin_tr909_VST3 plugin_tr909_Standalone lemustest_tr909
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-tr808 --config Release --parallel --target plugin_tr808_VST3 plugin_tr808_Standalone lemustest_tr808
      - name: Test
        run: |
          build/release-win/lemustest_tb303_artefacts/Release/lemustest_tb303.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-tr909/lemustest_tr909_artefacts/Release/lemustest_tr909.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-tr808/lemustest_tr808_artefacts/Release/lemustest_tr808.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win/lemustest_instrument_artefacts/Release/lemustest_instrument.exe
      - name: Package
        shell: pwsh
        run: |
          tools/release/windows.ps1 -Build build/release-win
          tools/release/windows.ps1 -Build build/release-win-tr909
          tools/release/windows.ps1 -Build build/release-win-tr808
      - name: Release
        id: version
        shell: pwsh
        run: |
          # A tag <plugin>-v<version> releases that plugin alone, at that version.
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$') {
            $plugin = $Matches[1]; $version = $Matches[2]
            $zip = "dist/$plugin-$version-windows.zip"
            if (-not (Test-Path $zip)) { throw "the tag is ${{ github.ref_name }} but there's no ${zip}: is the plugin's VERSION $version?" }
            Get-ChildItem dist/*.zip | Where-Object { $_.Name -ne "$plugin-$version-windows.zip" } | Remove-Item
            "plugin=$plugin" >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
          }
      - name: Upload for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != '' && steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: plugins-windows-unsigned
          path: dist/*.zip
      - name: Sign
        if: env.SIGNPATH_API_TOKEN != '' && steps.version.outputs.version != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: lemus
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Use the signed zips
        if: env.SIGNPATH_API_TOKEN != '' && steps.version.outputs.version != ''
        shell: pwsh
        run: Move-Item -Force build/signed/*.zip dist/
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-windows
          path: dist/*.zip
