# The Windows release: each shipping machine's own plugin (VST3 and the standalone app), checked
# with its own tests and the instruments host's (the runner has no ROMs, so the machines are checked
# in voice mode), each zipped by tools/release/windows.ps1. The TR-909 and TR-808 are built with clang-cl: the
# 909's circuit solver runs about 15 % faster than with MSVC (windows-machine.yml's bench), and the 808's is the same solver.
# The Virus C too, as the compiler closest to the macOS build's (its own code; the DSP engine compiles its own), and the
# QuadraVerb GT (the 909's solver again; an effect, so the effects host's tests too), and the SH-101
# (its voice is Newton solvers, as the 909's; both compilers pass windows-machine.yml), and the RAT (a
# nodal DK solver with Newton; an effect with no standalone app). Lemus Plugin Manager (manager/README.md) is
# built and checked here too and zipped by tools/release/manager-windows.ps1; its tag is
# lemus-plugin-manager-v<version>. Runs on demand
# and for release tags; the zips are the run's artifact. A tag builds only in the public repo, where
# Actions minutes are free: in the private repo it runs when started by hand, the check before a
# release. Each plugin has its own version (its
# lemus_plugin() VERSION) and its own tag, <plugin>-v<version> (ro-drums-909-v0.2.1): a tag's run
# keeps only that plugin's zip, and fails if the plugin isn't at the tag's version. The macOS release
# is built locally (tools/release/mac.sh), where the signing keys are.
#
# Where the SignPath secrets are set (the public repo, github.com/lemus-dev/lemus), the zips are
# signed by SignPath Foundation: the exe and the VST3 in each (tools/release/signpath.xml), once a
# person approves the request on signpath.io. Without them the zips stay unsigned.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['*-v[0-9]*']

jobs:
  windows:
    if: github.event_name != 'push' || github.repository == 'lemus-dev/lemus'
    runs-on: windows-2022
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: |
          cmake -S . -B build/release-win -G "Visual Studio 17 2022" -A x64 -DLEMUS_MACHINES=tb303 -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-tr909 -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLEMUS_MACHINES=tr909 -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-tr808 -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLEMUS_MACHINES=tr808 -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-virusc -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLEMUS_MACHINES=virusc -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-qvgt -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLEMUS_MACHINES=qvgt -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-sh101 -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLEMUS_MACHINES=sh101 -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-rat -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLEMUS_MACHINES=rat -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-manager -G "Visual Studio 17 2022" -A x64 -DLEMUS_MACHINES=tb303 -DLEMUS_TOOLS=OFF -DLEMUS_COPY_PLUGINS=OFF
      - name: Build
        run: |
          cmake --build build/release-win --config Release --parallel --target plugin_tb303_VST3 plugin_tb303_Standalone lemustest_tb303 lemustest_instrument
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-tr909 --config Release --parallel --target plugin_tr909_VST3 plugin_tr909_Standalone lemustest_tr909
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-tr808 --config Release --parallel --target plugin_tr808_VST3 plugin_tr808_Standalone lemustest_tr808
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-virusc --config Release --parallel --target plugin_virusc_VST3 plugin_virusc_Standalone lemustest_virusc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-qvgt --config Release --parallel --target plugin_qvgt_VST3 plugin_qvgt_Standalone lemustest_qvgt lemustest_fx
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-sh101 --config Release --parallel --target plugin_sh101_VST3 plugin_sh101_Standalone lemustest_sh101
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-rat --config Release --parallel --target plugin_rat_VST3 lemustest_rat lemustest_fx ratplugintest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-manager --config Release --parallel --target lemus_manager lemustest_manager
      - name: Test
        run: |
          build/release-win/lemustest_tb303_artefacts/Release/lemustest_tb303.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-tr909/lemustest_tr909_artefacts/Release/lemustest_tr909.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-tr808/lemustest_tr808_artefacts/Release/lemustest_tr808.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-virusc/lemustest_virusc_artefacts/Release/lemustest_virusc.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-qvgt/lemustest_qvgt_artefacts/Release/lemustest_qvgt.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-qvgt/lemustest_fx_artefacts/Release/lemustest_fx.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-sh101/lemustest_sh101_artefacts/Release/lemustest_sh101.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-rat/lemustest_rat_artefacts/Release/lemustest_rat.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-rat/lemustest_fx_artefacts/Release/lemustest_fx.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-rat/ratplugintest_artefacts/Release/ratplugintest.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-manager/lemustest_manager_artefacts/Release/lemustest_manager.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win/lemustest_instrument_artefacts/Release/lemustest_instrument.exe
      - name: Package
        shell: pwsh
        run: |
          tools/release/windows.ps1 -Build build/release-win
          tools/release/windows.ps1 -Build build/release-win-tr909
          tools/release/windows.ps1 -Build build/release-win-tr808
          tools/release/windows.ps1 -Build build/release-win-virusc
          tools/release/windows.ps1 -Build build/release-win-qvgt
          tools/release/windows.ps1 -Build build/release-win-sh101
          tools/release/windows.ps1 -Build build/release-win-rat
          tools/release/manager-windows.ps1 -Build build/release-win-manager
      - name: Release
        id: version
        shell: pwsh
        run: |
          # A tag <plugin>-v<version> releases that plugin alone, at that version.
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$') {
            $plugin = $Matches[1]; $version = $Matches[2]
            $zip = "dist/$plugin-$version-windows.zip"
            if (-not (Test-Path $zip)) { throw "the tag is ${{ github.ref_name }} but there's no ${zip}: is the plugin's VERSION $version?" }
            Get-ChildItem dist/*.zip | Where-Object { $_.Name -ne "$plugin-$version-windows.zip" } | Remove-Item
            "plugin=$plugin" >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
          }
      - name: Upload for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != '' && steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: plugins-windows-unsigned
          path: dist/*.zip
      - name: Sign
        if: env.SIGNPATH_API_TOKEN != '' && steps.version.outputs.version != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: lemus
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Use the signed zips
        if: env.SIGNPATH_API_TOKEN != '' && steps.version.outputs.version != ''
        shell: pwsh
        run: Move-Item -Force build/signed/*.zip dist/
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-windows
          path: dist/*.zip
