# The Windows release: each shipping machine's own plugin (VST3 and the standalone app), checked
# with its own tests and the instruments host's (the runner has no ROMs, so the machines are checked
# in voice mode), each zipped by tools/release/windows.ps1. The TR-909 is built with clang-cl: its
# circuit solver runs about 15 % faster than with MSVC (windows-machine.yml's bench). Runs on demand and for version tags; the
# zips are the run's artifact. The macOS release is built locally (tools/release/mac.sh), where the
# signing keys are.
#
# Where the SignPath secrets are set (the public repo, github.com/lemus-dev/lemus), the zips are
# signed by SignPath Foundation: the exe and the VST3 in each (tools/release/signpath.xml), once a
# person approves the request on signpath.io. Without them the zips stay unsigned.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-2022
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: |
          cmake -S . -B build/release-win -G "Visual Studio 17 2022" -A x64 -DLEMUS_MACHINES=tb303 -DLEMUS_COPY_PLUGINS=OFF
          cmake -S . -B build/release-win-tr909 -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLEMUS_MACHINES=tr909 -DLEMUS_COPY_PLUGINS=OFF
      - name: Build
        run: |
          cmake --build build/release-win --config Release --parallel --target plugin_tb303_VST3 plugin_tb303_Standalone lemustest_tb303 lemustest_instrument
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/release-win-tr909 --config Release --parallel --target plugin_tr909_VST3 plugin_tr909_Standalone lemustest_tr909
      - name: Test
        run: |
          build/release-win/lemustest_tb303_artefacts/Release/lemustest_tb303.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win-tr909/lemustest_tr909_artefacts/Release/lemustest_tr909.exe; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/release-win/lemustest_instrument_artefacts/Release/lemustest_instrument.exe
      - name: Package
        shell: pwsh
        run: |
          tools/release/windows.ps1 -Build build/release-win
          tools/release/windows.ps1 -Build build/release-win-tr909
      - name: Version
        id: version
        shell: pwsh
        run: '"version=" + (Select-String -Path CMakeLists.txt -Pattern "project\(LEMUS VERSION ([0-9.]+)").Matches[0].Groups[1].Value >> $env:GITHUB_OUTPUT'
      - name: Upload for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: plugins-windows-unsigned
          path: dist/*.zip
      - name: Sign
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: lemus
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Use the signed zips
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Move-Item -Force build/signed/*.zip dist/
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-windows
          path: dist/*.zip
