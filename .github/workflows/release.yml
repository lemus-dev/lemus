# The Windows release: each shipping machine's own plugin (VST3 and the standalone app), checked
# with its own tests (the runner has no ROMs, so the machines are checked in voice mode), each zipped
# by tools/release/windows.ps1, and Lemus Plugin Manager (manager/README.md), zipped by
# tools/release/manager-windows.ps1. Each plugin has its own version (its lemus_plugin() VERSION)
# and its own tag, <plugin>-v<version> (ro-drums-909-v0.2.1; the manager's is
# lemus-plugin-manager-v<version>): a tag's run builds and checks that plugin alone and fails if it
# isn't at the tag's version. A run started by hand builds and checks them all, side by side: the
# check before a release. A tag builds only in the public repo, where Actions minutes are free; in
# the private repo the workflow runs only when started by hand. Each plugin's zip is the run's
# artifact windows-<plugin>. The macOS release is built locally (tools/release/mac.sh).
#
# Compilers: the TR-909 and TR-808 are built with clang-cl, the 909's circuit solver running about
# 15 % faster than with MSVC (windows-machine.yml's bench; the 808's is the same solver); the Virus C
# too, as the compiler closest to the macOS build's; the QuadraVerb GT (the 909's solver again), the
# SH-101 (Newton solvers, as the 909's) and the RAT (a nodal DK solver with Newton). The TB-303 and
# the manager are built with MSVC. The 303 also runs the instruments host's checks; the effects
# (QuadraVerb GT, RAT) the effects host's.
#
# Where the SignPath secrets are set (the public repo, github.com/lemus-dev/lemus), a tag's zip is
# signed by SignPath Foundation: the exe and the VST3 in it (tools/release/signpath.xml), once a
# person approves the request on signpath.io. Without them the zips stay unsigned.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['*-v[0-9]*']

jobs:
  # Which plugins this run builds: a tag's own, or all of them.
  plan:
    if: github.event_name != 'push' || github.repository == 'lemus-dev/lemus'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        run: |
          all='[
            {"plugin": "ro-mono-303", "machine": "tb303", "toolset": "", "targets": "plugin_tb303_VST3 plugin_tb303_Standalone lemustest_tb303 lemustest_instrument", "tests": "lemustest_tb303 lemustest_instrument", "package": "windows"},
            {"plugin": "ro-drums-909", "machine": "tr909", "toolset": "ClangCL", "targets": "plugin_tr909_VST3 plugin_tr909_Standalone lemustest_tr909", "tests": "lemustest_tr909", "package": "windows"},
            {"plugin": "ro-drums-808", "machine": "tr808", "toolset": "ClangCL", "targets": "plugin_tr808_VST3 plugin_tr808_Standalone lemustest_tr808", "tests": "lemustest_tr808", "package": "windows"},
            {"plugin": "ac-digital-vc", "machine": "virusc", "toolset": "ClangCL", "targets": "plugin_virusc_VST3 plugin_virusc_Standalone lemustest_virusc", "tests": "lemustest_virusc", "package": "windows"},
            {"plugin": "al-fx-quadgt", "machine": "qvgt", "toolset": "ClangCL", "targets": "plugin_qvgt_VST3 plugin_qvgt_Standalone lemustest_qvgt lemustest_fx", "tests": "lemustest_qvgt lemustest_fx", "package": "windows"},
            {"plugin": "ro-mono-101", "machine": "sh101", "toolset": "ClangCL", "targets": "plugin_sh101_VST3 plugin_sh101_Standalone lemustest_sh101", "tests": "lemustest_sh101", "package": "windows"},
            {"plugin": "pr-dist-r", "machine": "rat", "toolset": "ClangCL", "targets": "plugin_rat_VST3 lemustest_rat lemustest_fx ratplugintest", "tests": "lemustest_rat lemustest_fx ratplugintest", "package": "windows"},
            {"plugin": "lemus-plugin-manager", "machine": "tb303", "toolset": "", "configure": "-DLEMUS_TOOLS=OFF", "targets": "lemus_manager lemustest_manager", "tests": "lemustest_manager", "package": "manager-windows"}
          ]'
          if [[ '${{ github.ref_type }}' == tag && '${{ github.ref_name }}' =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            matrix=$(jq -c --arg p "${BASH_REMATCH[1]}" '[.[] | select(.plugin == $p)]' <<<"$all")
            if [[ $matrix == '[]' ]]; then echo "the tag is ${{ github.ref_name }} but this workflow doesn't build ${BASH_REMATCH[1]}"; exit 1; fi
          else
            matrix=$(jq -c . <<<"$all")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.[].plugin' <<<"$matrix"

  windows:
    needs: plan
    name: ${{ matrix.plugin }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        shell: pwsh
        run: |
          $toolset = if ('${{ matrix.toolset }}') { @('-T', '${{ matrix.toolset }}') } else { @() }
          # @(): one option must stay an array, or splatting spreads its characters.
          $extra = @('${{ matrix.configure }}' -split ' ' | Where-Object { $_ })
          cmake -S . -B build/release-win -G "Visual Studio 17 2022" -A x64 @toolset -DLEMUS_MACHINES=${{ matrix.machine }} -DLEMUS_COPY_PLUGINS=OFF @extra
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build/release-win --config Release --parallel --target ('${{ matrix.targets }}' -split ' ')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test
        shell: pwsh
        run: |
          foreach ($test in '${{ matrix.tests }}' -split ' ') {
            & "build/release-win/${test}_artefacts/Release/$test.exe"
            if ($LASTEXITCODE) { throw "$test failed ($LASTEXITCODE)" }
          }
      - name: Package
        shell: pwsh
        run: tools/release/${{ matrix.package }}.ps1 -Build build/release-win
      - name: Release
        id: version
        shell: pwsh
        run: |
          # A tag <plugin>-v<version> releases that plugin alone, at that version.
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$') {
            $plugin = $Matches[1]; $version = $Matches[2]
            $zip = "dist/$plugin-$version-windows.zip"
            if (-not (Test-Path $zip)) { throw "the tag is ${{ github.ref_name }} but there's no ${zip}: is the plugin's VERSION $version?" }
            Get-ChildItem dist/*.zip | Where-Object { $_.Name -ne "$plugin-$version-windows.zip" } | Remove-Item
            "plugin=$plugin" >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
          }
      - name: Upload for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != '' && steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.plugin }}-unsigned
          path: dist/*.zip
      - name: Sign
        if: env.SIGNPATH_API_TOKEN != '' && steps.version.outputs.version != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: lemus
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"
      - name: Use the signed zip
        if: env.SIGNPATH_API_TOKEN != '' && steps.version.outputs.version != ''
        shell: pwsh
        run: Move-Item -Force build/signed/*.zip dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.plugin }}
          path: dist/*.zip
